[project]
name = "distributed-inference-artifacts"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "aiofiles>=25.1.0",
  "aiorwlock>=1.5.1",
  "distributed-inference-shared",
  "pydantic>=2.8",
]

[dependency-groups]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artifacts"]

[tool.uv.sources]
distributed-inference-shared = { path = "../shared", editable = true }
