[project]
name = "distributed-inference-advertisement"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "distributed-inference-catalog",
  "distributed-inference-integration",
  "distributed-inference-lifecycle",
  "distributed-inference-shared",
]

[project.optional-dependencies]
arrow = ["pyarrow>=25.0.0"]
http = ["httpx>=0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advertisement"]

[tool.uv.sources]
distributed-inference-catalog = { path = "../catalog", editable = true }
distributed-inference-integration = { path = "../integration", editable = true }
distributed-inference-lifecycle = { path = "../lifecycle", editable = true }
distributed-inference-shared = { path = "../shared", editable = true }
