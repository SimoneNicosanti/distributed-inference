[project]
name = "distributed-inference-integration"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "distributed-inference-shared",
  "numpy>=2.0",
  "pyarrow>=25.0.0",
  "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/integration"]

[tool.uv.sources]
distributed-inference-shared = { path = "../shared", editable = true }
