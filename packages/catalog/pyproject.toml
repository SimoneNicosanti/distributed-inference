[project]
name = "distributed-inference-catalog"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "distributed-inference-integration",
  "distributed-inference-shared",
  "redis>=8.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog"]

[tool.uv.sources]
distributed-inference-integration = { path = "../integration", editable = true }
distributed-inference-shared = { path = "../shared", editable = true }
