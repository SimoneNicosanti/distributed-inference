[project]
name = "distributed-inference"
version = "0.1.0"
# ATTENZIONE: verifica con `uv sync --verbose | grep -i building` che nessuna
# dipendenza stia compilando da sorgente per mancanza di wheel cp314
# (candidati: onnxsim, onnxslim, pyroute2, psycopg). Se sì, è probabilmente
# il costo dominante del setup del container: scendere a ">=3.13" lo azzera.
requires-python = ">=3.14"

# Solo ciò che serve DAVVERO a runtime al core del pacchetto.
# Rimossi da qui:
#   - fakeredis     -> è un test double, sta in [dependency-groups].dev
#   - types-aiofiles-> stub di tipo, sta in dev
#   - pydot         -> graph viz, sta in dev (era duplicato con dev>=1.4)
#   - onnx-tool     -> già presente nell'extra model-management
dependencies = [
  "aiofiles>=25.1.0",
  "aiorwlock>=1.5.1",
  "fastapi>=0.139.2",
  "httpx>=0.28.1",
  "numpy>=2.0",
  "pydantic>=2.8",
  "python-multipart>=0.0.32",
  "pyyaml>=6.0",
  "readerwriterlock>=1.0.9",
  "redis>=8.0.1",
  "structlog>=24.0",
  "types-networkx>=3.6.1.20260624",
]

# ---------------------------------------------------------------------------
# PROFILI DI DEPLOY -> extras, non dependency-groups.
#
# I dependency-groups (PEP 735) NON finiscono nei metadati del wheel: esistono
# solo per chi lavora sul repo. Se costruisci immagini per servizio con
# `pip install distributed-inference[runtime]`, devono essere extras.
#
#   uv sync --extra runtime
#   uv sync --all-extras
# ---------------------------------------------------------------------------
[project.optional-dependencies]
runtime = [
  "onnxruntime>=1.27",
  "pyarrow>=18.0",
  "pyro5>=5.15",
  "prometheus-client>=0.21",
]

control = ["pyomo>=6.8", "kubernetes>=32.0", "pyro5>=5.15"]

measurement = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "prometheus-client>=0.21",
  "pandas>=2.2",
]

network-agent = ["pyroute2>=0.7", "prometheus-client>=0.21"]

model-management = [
  "onnx>=1.17",
  "onnxruntime>=1.27",
  "networkx>=3.4",
  "onnx-tool>=1.0.1",
  "onnxscript>=0.7",
  "onnxsim>=0.6.5",
  "onnxslim>=0.1.94",
  "pyro5>=5.15",
]
# types-networkx spostato in dev: gli stub non servono a runtime.
# fastapi rimosso: è già in [project].dependencies.

gcp = ["google-cloud-storage>=3.0"]

# Comodità: tutti i profili in un colpo solo.
all = [
  "distributed-inference[runtime,control,measurement,network-agent,model-management,gcp]",
]

# ---------------------------------------------------------------------------
# TOOLING DI SVILUPPO -> dependency-groups
#
# Modifica chiave: il tooling ML pesante (torch, transformers, ultralytics,
# optimum) è uscito da `dev` ed è finito in `export`. Conseguenze:
#   - `uv sync` scarica ~3GB in meno: setup del container molto più rapido
#   - Pylance non indicizza più torch (centinaia di MB di indice, molta RAM)
#   - il grafo di import di mypy si riduce drasticamente
#
# Chi deve convertire modelli: `uv sync --frozen --group export`
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
  # test
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.6",    # -n auto: quasi sempre un raddoppio su suite con onnxruntime
  "fakeredis>=2.37.0",
  # qualità
  # [dmypy] porta psutil, necessario al daemon usato dall'estensione VS Code.
  # [native-parser] è richiesto dalla modalità parallela di mypy 2.x.
  "mypy[dmypy,native-parser]>=2.3",
  "ruff>=0.9",
  "pre-commit>=4.0",
  # stub di tipo
  "types-aiofiles>=25.1.0.20260518",
  "types-networkx>=3.4",
  "types-pyyaml>=6.0",
  # utilità
  "ipython>=8.0",
]

export = [
  "torch>=2.13",
  "torchvision>=0.28",
  "transformers>=4.57.6",
  "optimum>=2.1.0",
  "optimum-onnx>=0.1.0",
  "ultralytics>=8.4.104",
  "onnxconverter-common>=1.16.0",
  "safetensors>=0.8.0",
  "pillow>=12.3.0",
  "matplotlib>=3.8",
  "pydot>=4.0.1",
]
# I pin esatti (==) sono passati a >=: la riproducibilità la garantisce uv.lock,
# che è la sede corretta. Vincoli == nel manifest bloccano gli aggiornamenti di
# sicurezza transitivi e generano conflitti di risoluzione difficili da leggere.

# ---------------------------------------------------------------------------
# BUILD SYSTEM — mancava, ed è la causa di diversi workaround.
#
# Senza [build-system] uv tratta il progetto come "virtuale" e NON installa
# src/. Da lì derivavano mypy_path, pythonpath, namespace_packages ed
# explicit_package_bases: cerotti sulla stessa ferita, ora rimossi.
# ---------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distributed_inference"]

[tool.uv]
package = true
default-groups = ["dev"] # `uv sync` non tira dentro `export`
compile-bytecode = true  # .pyc all'install: startup più rapido di pytest/mypy
# NON restringere le piattaforme con `environments = [...]`: il lockfile
# conterrebbe solo wheel Linux e `uv sync` sull'host macOS/Windows fallirebbe,
# rompendo il .venv locale che vuoi mantenere utilizzabile.
# Abilitalo SOLO se tutto il team sviluppa esclusivamente dentro il container:
# environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ---------------------------------------------------------------------------
# MYPY
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
files = ["src", ]

# Parallelismo introdotto in mypy 2.0 (fino a ~5x con 8 worker). Richiede e
# abilita automaticamente --native-parser. Sovrascritto da MYPY_NUM_WORKERS,
# impostato nel devcontainer. Parti da 3-4 e sali finché migliora.
num_workers = 4

# Il plugin pydantic è indispensabile con strict: senza, i modelli generano
# falsi positivi sui __init__ sintetizzati.
plugins = ["pydantic.mypy"]

strict = true
enable_error_code = ["explicit-override", "redundant-expr", "truthy-bool"]

# Rimossi perché GIÀ inclusi in strict = true:
#   warn_unused_configs, disallow_any_generics, warn_return_any
# (warn_unused_configs, inoltre, funziona solo con --no-incremental:
#  nel tuo setup era comunque inerte)
warn_unreachable = true

# La tua configurazione aveva `disallow_any_unimported = false` con un commento
# che descriveva l'effetto opposto. Impostato a true: con gli override
# ignore_missing_imports più sotto, ti segnala dove un Any da libreria non
# tipizzata entra in una firma pubblica — che è esattamente il rischio che il
# commento originale voleva scongiurare. Mettilo a false se il rumore è eccessivo.
disallow_any_unimported = true

# sqlite_cache RIMOSSO: da mypy 2.3 è attivo per default insieme alla cache
# in formato binario a lunghezza fissa. Impostarlo a false disabilitava due
# ottimizzazioni pensate esattamente per il tuo problema.
# La cache vive in MYPY_CACHE_DIR (volume, non bind mount): vedi devcontainer.json.

pretty = true
show_error_codes = true
show_column_numbers = true
# show_error_context RIMOSSO: allunga l'output senza aggiungere informazione
# quando hai già codici ed errori con colonna.

# `exclude` RIMOSSO: files = ["src", "test"] già esclude deployment/,
# experiments/, tools/ e .venv. In più `exclude` non impedisce a mypy di
# seguirci gli import — per quello serve follow_imports.

## TODO Double check this onnxruntime configuration
# Stub mancanti nelle librerie di terze parti.
[[tool.mypy.overrides]]
module = [
  "Pyro5.*",
  "onnx_tool.*",
  "onnxsim.*",
  "onnxslim.*",
  "onnx.*",
  "sympy.*",
  "pyroute2.*",
  "pyomo.*",
  "fakeredis.*",
  "ort.*"
]
ignore_missing_imports = true

# Il tooling ML non è nei default-groups, ma se lavori con --group export
# questi override evitano che mypy attraversi torch/transformers (facilmente
# la voce di costo maggiore dell'analisi).
# Trade-off reale: questi moduli diventano Any, quindi perdi i controlli sulle
# firme che li attraversano. Accettabile per torch/ultralytics, NON per
# pydantic o fastapi.
[[tool.mypy.overrides]]
module = [
  "torch.*",
  "torchvision.*",
  "transformers.*",
  "optimum.*",
  "ultralytics.*",
  "matplotlib.*",
  "pandas.*",
  "kubernetes.*",
  "onnxruntime.*",
]
ignore_missing_imports = false
follow_imports = "normal"
follow_untyped_imports = true

# I test possono essere un filo più permissivi: i decoratori di pytest e i
# fixture non tipizzati generano rumore senza valore diagnostico.
[[tool.mypy.overrides]]
module = ["test.*"]
disallow_untyped_decorators = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# PYTEST
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["test"]
# `pythonpath` RIMOSSO: il pacchetto è installato in editable, non serve
# più manipolare sys.path.
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",         # errore su chiavi ini sconosciute o typo
  "--import-mode=importlib", # modalità raccomandata con layout src
]
# --cov volutamente FUORI da addopts: la strumentazione di coverage rallenta
# ogni run locale. Abilitala solo in CI: pytest --cov --cov-report=xml
# Parallelismo: pytest -n auto  (lasciato fuori da addopts perché rompe pdb)

xfail_strict = true
asyncio_mode = "strict"
# Senza questa riga pytest-asyncio >=0.24 emette un DeprecationWarning a ogni run.
asyncio_default_fixture_loop_scope = "function"

# Abilitalo quando la suite è pulita: trasforma i warning in errori e ti evita
# di accumulare deprecazioni silenziose (utile con l'ecosistema onnx/torch).
# filterwarnings = ["error"]

markers = [
  "unit: test isolati",
  "integration: test di integrazione",
  "contract: test comuni ai diversi backend",
]

# ---------------------------------------------------------------------------
# RUFF — unica fonte di verità per lint e format Python
# (rimosso da trunk.yaml: stessa versione in editor, pre-commit e CI)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88                               # esplicito ma identico al default: nessun riformattamento
target-version = "py314"
src = ["src", "test"]                          # risoluzione corretta dei first-party per isort
extend-exclude = []

[tool.ruff.lint]
# ATTENZIONE: questa selezione è più ampia della tua (`extend-select = ["I"]`)
# e al primo giro produrrà molte segnalazioni. Introducila per gruppi, non
# tutta insieme: parti da E,F,W,I,UP e aggiungi il resto quando il repo è verde.
select = [
  "E",     # pycodestyle
  "F",     # pyflakes
  "W",     # warning
  "I",     # isort
  "N",     # pep8-naming
  "UP",    # pyupgrade
  "B",     # bugbear
  "C4",    # comprehensions
  "SIM",   # simplify
  "ASYNC", # asyncio: rilevante, il progetto è tutto async
  "PTH",   # usa pathlib invece di os.path
  "TID",   # import relativi vietati
  "RUF",   # regole specifiche di ruff
  "LOG",   # logging
  "G",     # formattazione dei messaggi di log
]
ignore = [
  "E501", # lunghezza riga: la gestisce il formatter
]

[tool.ruff.lint.isort]
known-first-party = ["distributed_inference"]

[tool.ruff.lint.flake8-bugbear]
# Senza questo, B008 segnala come errore ogni Depends()/Query() nelle firme
# FastAPI, che è invece il pattern corretto.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Header",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Body",
]

[tool.ruff.lint.per-file-ignores]
# Nei test assert nudi e valori magici sono normali.
"test/**/*.py" = ["S101", "PLR2004", "ANN"]
"**/__init__.py" = ["F401"]                 # re-export intenzionali

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# COVERAGE — mancava del tutto pur avendo pytest-cov
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/experiments/*", "*/tools/*"]

[tool.coverage.report]
skip_covered = true
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
  "if __name__ == .__main__.:",
]
