name: distributed-inference


services:

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - "127.0.0.1:5540:5540"
    depends_on:
      - redis

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: mini -dir=/data
    ports:
      - "8333:8333"
      - "8900:8888"
    volumes:
      - seaweedfs-data:/data


  model-manager:
    build:
      context: ../../
      dockerfile: docker/model_manager.dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - seaweedfs

  controller:
    build:
      context: ../../
      dockerfile: docker/controller.dockerfile
    environment:
      GRB_LICENSE_FILE: /run/secrets/gurobi_license
    secrets:
      - gurobi_license
    ports:
      - "8001:8000"
    depends_on:
      - redis

  first-worker:
    build:
      context: ../../
      dockerfile: docker/worker.dockerfile
    depends_on:
      - redis
      - seaweedfs
    environment:
      WORKER_INGRESS_ENABLED: "true"
      WORKER_ADVERTISED_HOST: first-worker
      SERVICE_ID: first-worker

  worker-1:
    build:
      context: ../../
      dockerfile: docker/worker.dockerfile
    depends_on:
      - redis
      - seaweedfs
    environment:
      WORKER_ADVERTISED_HOST: worker-1
      SERVICE_ID: worker-1

  worker-2:
    build:
      context: ../../
      dockerfile: docker/worker.dockerfile
    depends_on:
      - redis
      - seaweedfs
    environment:
      WORKER_ADVERTISED_HOST: worker-2
      SERVICE_ID: worker-2
    gpus: all

  worker-3:
    build:
      context: ../../
      dockerfile: docker/worker.dockerfile
    depends_on:
      - redis
      - seaweedfs
    environment:
      WORKER_ADVERTISED_HOST: worker-3
      SERVICE_ID: worker-3

  front-end:
    build:
      context: ../../
      dockerfile: docker/front_end.dockerfile
    environment:
      WORKER_HTTP_BASE_URL: http://first-worker:9000
      WORKER_MODEL_INVOCATION_LOCATION: grpc+tcp://first-worker:8818
    depends_on:
      - model-manager
      - first-worker

  system-test:
    build:
      context: ../../
      dockerfile: docker/system_test.dockerfile
    profiles: ["test"]
    environment:
      FRONT_END_BASE_URL: http://front-end:8000
    command: ["sleep", "infinity"]
    volumes:
      - ../../assets/models:/app/assets/models
      - ../../test/system:/app/test/system

volumes:
  redis-data:
    driver: local

  seaweedfs-data:
    driver: local

secrets:
  gurobi_license:
    file: ../../gurobi.lic
