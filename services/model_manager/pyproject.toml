[project]
name = "distributed-inference-model-manager"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "aiofiles>=25.1.0",
  "boto3>=1.43.116",
  "botocore>=1.43.116",
  "distributed-inference-artifacts",
  "distributed-inference-catalog",
  "distributed-inference-integration",
  "distributed-inference-lifecycle",
  "distributed-inference-shared",
  "distributed-inference-utils",
  "fastapi>=0.139.2",
  "networkx>=3.4",
  "numpy>=2.0",
  "onnx>=1.17",
  "onnx-tool>=1.0.1",
  "onnxruntime>=1.27.0",
  "pydantic>=2.8",
  "redis>=8.0.1",
  "uvicorn[standard]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_manager"]

[tool.uv.sources]
distributed-inference-artifacts = { path = "../../packages/artifacts", editable = true }
distributed-inference-catalog = { path = "../../packages/catalog", editable = true }
distributed-inference-integration = { path = "../../packages/integration", editable = true }
distributed-inference-lifecycle = { path = "../../packages/lifecycle", editable = true }
distributed-inference-shared = { path = "../../packages/shared", editable = true }
distributed-inference-utils = { path = "../../packages/utils", editable = true }
