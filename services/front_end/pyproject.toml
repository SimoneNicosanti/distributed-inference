[project]
name = "distributed-inference-front-end"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "aiofiles>=25.1.0",
  "boto3>=1.43.116",
  "botocore>=1.43.116",
  "distributed-inference-artifacts",
  "distributed-inference-integration",
  "distributed-inference-shared",
  "fastapi>=0.139.2",
  "httpx>=0.28.1",
  "numpy>=2.0",
  "pyarrow>=25.0.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/front_end"]

[tool.uv.sources]
distributed-inference-artifacts = { path = "../../packages/artifacts", editable = true }
distributed-inference-integration = { path = "../../packages/integration", editable = true }
distributed-inference-shared = { path = "../../packages/shared", editable = true }
