[project]
name = "distributed-inference-priority-effect"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["distributed-inference-scalability"]

[project.scripts]
priority-effect = "priority_effect.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9", "mypy>=2.3", "types-pyyaml>=6"]
export = ["torch>=2.13", "torchvision>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/priority_effect"]

[tool.uv.sources]
distributed-inference-scalability = { path = "../scalability", editable = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
distributed-inference-controller = { path = "../../services/controller", editable = true }
distributed-inference-model-manager = { path = "../../services/model_manager", editable = true }
distributed-inference-optimizer = { path = "../../services/optimizer", editable = true }
distributed-inference-advertisement = { path = "../../packages/advertisement", editable = true }
distributed-inference-artifacts = { path = "../../packages/artifacts", editable = true }
distributed-inference-blocks = { path = "../../packages/blocks", editable = true }
distributed-inference-catalog = { path = "../../packages/catalog", editable = true }
distributed-inference-integration = { path = "../../packages/integration", editable = true }
distributed-inference-redis-access = { path = "../../packages/redis_access", editable = true }
distributed-inference-shared = { path = "../../packages/shared", editable = true }
distributed-inference-utils = { path = "../../packages/utils", editable = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires ONNX profiling or a Gurobi license"]
