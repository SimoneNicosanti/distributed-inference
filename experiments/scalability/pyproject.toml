[project]
name = "distributed-inference-scalability"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "distributed-inference-controller",
  "distributed-inference-model-manager",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
]

[project.scripts]
scalability = "scalability_benchmark.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9", "mypy>=2.3", "types-pyyaml>=6"]
export = ["torch>=2.13", "torchvision>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scalability_benchmark"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
distributed-inference-controller = { path = "../../services/controller", editable = true }
distributed-inference-model-manager = { path = "../../services/model_manager", editable = true }
distributed-inference-advertisement = { path = "../../packages/advertisement", editable = true }
distributed-inference-artifacts = { path = "../../packages/artifacts", editable = true }
distributed-inference-catalog = { path = "../../packages/catalog", editable = true }
distributed-inference-integration = { path = "../../packages/integration", editable = true }
distributed-inference-lifecycle = { path = "../../packages/lifecycle", editable = true }
distributed-inference-shared = { path = "../../packages/shared", editable = true }
distributed-inference-utils = { path = "../../packages/utils", editable = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
asyncio_mode = "strict"
markers = ["integration: requires ONNX profiling or a Gurobi license"]
